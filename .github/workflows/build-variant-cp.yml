name: Build VaryForge control-plane image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control-plane worker
        run: |
          docker build -f deploy/runpod/Dockerfile -t ghcr.io/snaughtyllc-cell/variant-cp:latest .
          docker push ghcr.io/snaughtyllc-cell/variant-cp:latest
