name: Build varimo Fast CPU worker (lab)

# Lab GitHub (snaughtyllc-cell/variant-maker) only.
# Experiment image only. Does not overwrite variant-fast:latest (live).
# Lab default branch is tier1 — that is the image Generate-on-lab should get
# after recycle. Do not add a :latest push here.
on:
  push:
    branches:
      - tier1
      - cursor/fast-shot-probe-c975
      - cursor/fast-chroma-cloud-c975
      - cursor/fast-cloud-less-grain-c975
      - cursor/fast-chroma-softer-c975
      - cursor/fast-720-luma-dust-c975
      - cursor/caption-safe-crop-c975
      - cursor/ig-720-fast-20-c975
      - cursor/aqmtp-uniqueness-c975
      - cursor/keyframe-crop-drift-cdb6
      - cursor/compete-smart-repurpose-cdb6
      - cursor/crop-drift-live-cdb6
      - cursor/copyid-lab-record-cdb6
      - cursor/lab-backlog-6cba
      - cursor/lab-fast-ffmpeg-btbn-ef2b
      - cursor/lab-fast-env-pin-ef2b
    paths:
      - deploy/runpod/Dockerfile.fast
      - deploy/runpod/install_btbn_ffmpeg.py
      - deploy/runpod/cp_handler.py
      - variant_maker/*.py
      - variant_maker/copyid/**
      - variant_maker/server/**
      - pyproject.toml
      - .github/workflows/build-variant-fast-lab.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Fast CPU lab tag
        id: push
        run: |
          docker build -f deploy/runpod/Dockerfile.fast \
            -t ghcr.io/snaughtyllc-cell/variant-fast:lab .
          docker push ghcr.io/snaughtyllc-cell/variant-fast:lab | tee /tmp/push.log
          DIGEST=$(grep -oE 'sha256:[a-f0-9]{64}' /tmp/push.log | tail -1)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Lab Fast digest $DIGEST"

  pin-lab:
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: "VaryForge Studio / lab"
    permissions:
      contents: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      LAB_FAST_ENDPOINT: xar25v77v3j27u
      LAB_FAST_DIGEST: ${{ needs.build-and-push.outputs.digest }}
    steps:
      - name: Pin Lab Fast endpoint to this digest
        run: |
          set -euo pipefail
          test "$LAB_FAST_ENDPOINT" = "xar25v77v3j27u"
          test "$LAB_FAST_ENDPOINT" != "j0b1q4iuunzhnq"
          test -n "$LAB_FAST_DIGEST"
          IMAGE="ghcr.io/snaughtyllc-cell/variant-fast@${LAB_FAST_DIGEST}"
          echo "Pin $LAB_FAST_ENDPOINT to $IMAGE"
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY unset on VaryForge Studio / lab; :lab is on GHCR. Recycle lab by hand. Do not PATCH live."
            exit 0
          fi
          curl -sfS -X PATCH "https://api.runpod.io/v2/serverless/${LAB_FAST_ENDPOINT}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\"}"
          echo "Pinned lab $LAB_FAST_ENDPOINT. Did not PATCH live."
